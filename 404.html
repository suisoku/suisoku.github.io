<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Noureddine Ziani</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      if (window.location.pathname.startsWith("/Kadr.ai/")) {
        document.documentElement.hidden = true;
        fetch("/Kadr.ai/index.html", { cache: "no-store" })
          .then((response) => {
            if (!response.ok) throw new Error("Dolores staging is unavailable.");
            return response.text();
          })
          .then((html) => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(() => window.location.replace("/Kadr.ai/"));
      }
    </script>
  </head>
  <body>
    <main class="not-found">
      <p class="eyebrow">404</p>
      <h1>This page isn’t here.</h1>
      <a class="button button-primary" href="/">Return home</a>
    </main>
  </body>
</html>
